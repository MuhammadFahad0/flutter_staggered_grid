name: flutter_staggered_grid_example
description: Demonstrates the layouts provided by flutter_staggered_grid.
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_staggered_grid:
    path: ../

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/
  uses-material-design: true
